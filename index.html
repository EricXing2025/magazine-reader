<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MagReader · 杂志阅读器</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <div class="tb-side tb-left">
    <button id="btn-open" class="tb-btn" data-i18n-title="openTitle">📖 <span data-i18n="open">打开</span></button>
    <button id="btn-home" class="tb-btn" data-i18n-title="homeTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6.5 9.8V20h11V9.8"/></svg></button>
    <span id="doc-name" data-i18n="noDoc">未打开文件</span>
  </div>
  <div class="tb-center">
    <span id="page-info"></span>
  </div>
  <div class="tb-side tb-right">
    <div id="annot-pal" hidden>
      <button class="pc on" style="--c:#ffd24d" data-c="#ffd24d"></button>
      <button class="pc" style="--c:#ff7eb0" data-c="#ff7eb0"></button>
      <button class="pc" style="--c:#6cd8ff" data-c="#6cd8ff"></button>
    </div>
    <button id="btn-hl" class="tb-btn" data-i18n-title="hlTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 8.5-8.5a1.8 1.8 0 0 1 2.5 0l1.5 1.5a1.8 1.8 0 0 1 0 2.5L10 19z"/><path d="m13 9 2.5 2.5"/><path d="M3.5 20.5h9"/></svg></button>
    <button id="btn-pen" class="tb-btn" data-i18n-title="penTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h18"/><path d="M3.5 14.5c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/></svg></button>
    <button id="btn-note" class="tb-btn" data-i18n-title="noteTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5H6A1.5 1.5 0 0 0 4.5 6v12A1.5 1.5 0 0 0 6 19.5h12a1.5 1.5 0 0 0 1.5-1.5V9z"/><path d="M14 4.5V9h5.5"/><path d="M8.5 12.5h7"/><path d="M8.5 15.5h5"/></svg></button>
    <button id="btn-erase" class="tb-btn" data-i18n-title="eraseTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.2" y="8.4" width="12.5" height="7.2" rx="1.2" transform="rotate(-35 10.5 12)"/><path d="M21 20.5H9"/></svg></button>
    <span class="tb-sep"></span>
    <button id="btn-ai" class="tb-btn" data-i18n-title="aiTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 13.7 8l4.5 1.7-4.5 1.7L12 16l-1.7-4.6-4.5-1.7L10.3 8z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></button>
    <select id="lang-sel" class="tb-btn" data-i18n-title="langTitle">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
    </select>
    <button id="btn-theme" class="tb-btn" data-i18n-title="themeTitle">☀️</button>
    <button id="btn-thumbs" class="tb-btn on" data-i18n-title="thumbsTitle">☰</button>
    <button id="btn-rtl" class="tb-btn" data-i18n-title="rtlTitle">⇦ RTL</button>
    <button id="btn-full" class="tb-btn" data-i18n-title="fullTitle">⛶</button>
  </div>
</header>

<div id="main">
  <aside id="sidebar">
    <div id="shelf-box" hidden>
      <div class="side-title" data-i18n="shelf">书架</div>
      <div id="shelf"></div>
    </div>
    <div id="recent-box" hidden>
      <div class="side-title" data-i18n="recent">最近打开</div>
      <div id="recent"></div>
    </div>
    <div class="side-title" data-i18n="annots">批注</div>
    <div id="annots"></div>
    <div class="side-title" data-i18n="pages">页面</div>
    <div id="thumbs"></div>
  </aside>
  <div id="stage">
    <div id="flip-root"><div id="book"></div></div>
    <div id="home">
      <div class="home-title" data-i18n="shelf">书架</div>
      <div id="home-grid"></div>
      <div class="home-sub" data-i18n="dropHint">把 PDF 拖到这里，或点左上角「打开」</div>
    </div>
  </div>
</div>

<div id="zoom-overlay" hidden>
  <div id="zoom-box"><canvas id="zoom-canvas"></canvas><div id="zoom-dom" hidden></div></div>
  <div id="zoom-hint" data-i18n="zoomHint">滚轮缩放 · 拖拽平移 · Esc / 双击关闭</div>
</div>

<div id="note-pop" hidden></div>

<div id="ai-modal" hidden>
  <div id="ai-panel">
    <div id="ai-head">
      <span data-i18n="aiTitle">AI 总结</span>
      <button id="ai-set-btn" class="tb-btn" data-i18n-title="aiSetTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg></button>
      <button id="ai-x" class="tb-btn">×</button>
    </div>
    <div id="ai-form" hidden>
      <label>Base URL<input id="ai-base" type="text" placeholder="https://api.openai.com/v1" spellcheck="false"></label>
      <label>API Key<input id="ai-key" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
        <div class="ai-hint" data-i18n="aiKeyHint">密钥只保存在本机浏览器，不会上传或提交</div></label>
      <label><span data-i18n="aiModel">模型</span><input id="ai-model" type="text" placeholder="gpt-4o-mini" spellcheck="false"></label>
      <button id="ai-save" class="tb-btn" data-i18n="aiSave">保存设置</button>
    </div>
    <div id="ai-out"></div>
    <div id="ai-foot">
      <button id="ai-gen" class="tb-btn" data-i18n="aiGen">生成总结</button>
    </div>
  </div>
</div>

<div id="tip" hidden></div>

<input type="file" id="file-input" accept="application/pdf,.pdf,.epub" hidden>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/page-flip.browser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
