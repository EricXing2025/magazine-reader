<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MagReader · 杂志阅读器</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <div class="tb-side tb-left">
    <button id="btn-open" class="tb-btn" data-i18n-title="openTitle">📖 <span data-i18n="open">打开</span></button>
    <span id="doc-name" data-i18n="noDoc">未打开文件</span>
  </div>
  <div class="tb-center">
    <span id="page-info"></span>
  </div>
  <div class="tb-side tb-right">
    <div id="annot-pal" hidden>
      <button class="pc on" style="--c:#ffd24d" data-c="#ffd24d"></button>
      <button class="pc" style="--c:#ff7eb0" data-c="#ff7eb0"></button>
      <button class="pc" style="--c:#6cd8ff" data-c="#6cd8ff"></button>
    </div>
    <button id="btn-hl" class="tb-btn" data-i18n-title="hlTitle">▮</button>
    <button id="btn-pen" class="tb-btn" data-i18n-title="penTitle">✏️</button>
    <button id="btn-note" class="tb-btn" data-i18n-title="noteTitle">📝</button>
    <button id="btn-erase" class="tb-btn" data-i18n-title="eraseTitle">🧽</button>
    <span class="tb-sep"></span>
    <select id="lang-sel" class="tb-btn" data-i18n-title="langTitle">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
    </select>
    <button id="btn-theme" class="tb-btn" data-i18n-title="themeTitle">☀️</button>
    <button id="btn-thumbs" class="tb-btn on" data-i18n-title="thumbsTitle">☰</button>
    <button id="btn-rtl" class="tb-btn" data-i18n-title="rtlTitle">⇦ RTL</button>
    <button id="btn-full" class="tb-btn" data-i18n-title="fullTitle">⛶</button>
  </div>
</header>

<div id="main">
  <aside id="sidebar">
    <div id="shelf-box" hidden>
      <div class="side-title" data-i18n="shelf">书架</div>
      <div id="shelf"></div>
    </div>
    <div class="side-title" data-i18n="annots">批注</div>
    <div id="annots"></div>
    <div class="side-title" data-i18n="pages">页面</div>
    <div id="thumbs"></div>
  </aside>
  <div id="stage">
    <div id="flip-root"><div id="book"></div></div>
    <div id="drop-hint">
      <div class="dh-inner">
        <div class="dh-icon">📖</div>
        <div data-i18n="dropHint">把 PDF 拖到这里，或点左上角「打开」</div>
        <div class="dh-sub" id="shelf-hint" hidden data-i18n="shelfHint">也可以从左侧书架选择</div>
      </div>
    </div>
  </div>
</div>

<div id="zoom-overlay" hidden>
  <div id="zoom-box"><canvas id="zoom-canvas"></canvas></div>
  <div id="zoom-hint" data-i18n="zoomHint">滚轮缩放 · 拖拽平移 · Esc / 双击关闭</div>
</div>

<div id="note-pop" hidden></div>

<input type="file" id="file-input" accept="application/pdf,.pdf" hidden>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/page-flip.browser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
